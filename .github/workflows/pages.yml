# The website and the documentation are one Astro site: web/ builds the
# landing page and renders docs/*.md under /docs/. This builds it on
# every pull request (as a check) and deploys it to GitHub Pages on
# every merge into main.
name: website

on:
  push:
    branches: [main]
    paths: ["web/**", "docs/**", ".github/workflows/pages.yml"]
  pull_request:
    branches: [main]
    paths: ["web/**", "docs/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; queue rather than cancel a running one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Build the site
        working-directory: web
        # SITE/BASE come from the Pages configuration, so the same build
        # works under github.io/<repo>/ and under a custom domain.
        env:
          SITE: https://jihedmastouri.github.io
          BASE: ${{ github.event_name == 'pull_request' && '/' || '/sqlide/' }}
        run: npm run build

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: web/dist

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
