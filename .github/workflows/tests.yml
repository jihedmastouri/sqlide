# Tests: on every pull request and on every merge into main.
name: tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          args: check sqlide tests scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # GTK, libadwaita and PyGObject are system packages — the venv is
      # created with --system-site-packages so `import gi` works from it
      # (same arrangement as the Makefile). xvfb gives GTK a display.
      - name: Install GTK4, libadwaita and PyGObject
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            python3-gi python3-gi-cairo python3-dev \
            gir1.2-gtk-4.0 gir1.2-adw-1 libadwaita-1-0 \
            libgirepository1.0-dev libcairo2-dev gettext xvfb

      - name: Start the database servers
        run: docker compose up -d --wait postgres16 mysql8

      - name: Create the venv and install sqlide
        run: make install PYTHON=python3

      - name: Compile every module and import the entry point
        run: xvfb-run -a make check PYTHON=python3

      - name: Run the tests
        run: xvfb-run -a .venv/bin/python -m pytest -q

      - name: Server logs (on failure)
        if: failure()
        run: docker compose logs --tail=100
