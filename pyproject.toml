[project]
name = "sqlide"
version = "0.1.0"
description = "A minimal SQL IDE for SQLite, MySQL, and PostgreSQL (GTK4 + libadwaita)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "PyGObject>=3.46",
]

[project.optional-dependencies]
mysql = ["PyMySQL>=1.1"]
postgres = ["psycopg[binary]>=3.1"]
jdbc = ["JayDeBeApi>=1.2"]
ssh = ["sshtunnel>=0.4"]
mcp = ["mcp>=1.0", "uvicorn>=0.23"]
keyring = ["keyring>=24"]
s3 = ["boto3>=1.28"]
all = ["PyMySQL>=1.1", "psycopg[binary]>=3.1", "JayDeBeApi>=1.2", "sshtunnel>=0.4", "mcp>=1.0", "uvicorn>=0.23", "keyring>=24", "boto3>=1.28"]
test = ["pytest>=8", "PyMySQL>=1.1", "psycopg[binary]>=3.1", "mcp>=1.0", "uvicorn>=0.23", "httpx>=0.27", "keyring>=24"]

[project.scripts]
sqlide = "sqlide.frontend.application:main"
# Headless backup runner: what systemd timers and cron entries call.
sqlide-backup = "sqlide.backend.backups.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["sqlide*"]

[tool.setuptools.package-data]
"sqlide.frontend" = ["style.css"]
"sqlide.backend.demo" = ["*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# gi.require_version() has to run before anything imports gi.repository,
# so these two files import after code on purpose.
"sqlide/frontend/application.py" = ["E402"]
"scripts/init_databases.py" = ["E402"]
